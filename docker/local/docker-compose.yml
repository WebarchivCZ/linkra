networks:
  queue-network: {}

services:
  linkra-server:
    build:
      context: ../..
    ports:
      - 8321:8080
    volumes:
      - ../../storage.db:/mnt/storage.db:rw
    depends_on:
      - valkey
    networks:
      queue-network: {}
    environment:
      - DB_PATH=/mnt/storage.db
      - VALKEY_ADDR=queue
      - VALKEY_PORT=6379
      - SERVER_ADDRESS=0.0.0.0:8080
      - SERVER_HOST=http://localhost:8321
    restart: on-failure:3

  linkra-worker:
    build:
      context: ../../workers/scoop-worker
    volumes:
      - ./worker-config.json:/app/config.json:ro
      - ./captures:/app/captures/:rw
    networks:
      queue-network: {}
    depends_on:
      - valkey
    restart: on-failure:3
    # shm_size: 1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:8.0-alpine
    command: >
      valkey-server
      --save 60 1
    networks:
      queue-network:
        aliases:
          - queue
